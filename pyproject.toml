[project]
name = "sqlmap-workbench"
version = "0.1.0"
description = "本地 sqlmap 中文工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlmap==1.10.10",
  "fastapi>=0.119,<1",
  "uvicorn[standard]>=0.38,<1",
  "pywinpty>=3.0,<4; sys_platform == 'win32'",
  "python-multipart>=0.0.20",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
